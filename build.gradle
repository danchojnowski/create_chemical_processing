plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.140'
}

group = 'com.createchemicalprocessing'
version = mod_version

java.toolchain.languageVersion = JavaLanguageVersion.of(21)
jar.manifest.attributes 'Implementation-Version': project.version

repositories {
    maven { url = 'https://maven.createmod.net' }
    maven { url = 'https://maven.tterrag.com' }
    maven { url = 'https://mvn.devos.one/snapshots' }
}

neoForge {
    version = neo_version
    runs {
        client { client() }
        server { server(); programArgument '--nogui' }
    }
    mods {
        create_chemical_processing { sourceSet sourceSets.main }
    }
}

dependencies {
    implementation("com.simibubi.create:create-${minecraft_version}:${create_version}:slim") { transitive = false }
    implementation "net.createmod.ponder:ponder-neoforge:1.0.82+mc${minecraft_version}"
    compileOnly "dev.engine-room.flywheel:flywheel-neoforge-api-${minecraft_version}:1.0.6"
    runtimeOnly "dev.engine-room.flywheel:flywheel-neoforge-${minecraft_version}:1.0.6"
    implementation "com.tterrag.registrate:Registrate:MC1.21-1.3.0+67"
}
